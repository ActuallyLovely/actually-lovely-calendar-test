<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baby in Bloom | Add to Calendar</title>
  <script src="https://cdn.jsdelivr.net/npm/add-to-calendar-button@latest" async defer></script>
  <style>
    :root {
      --ivory: #fbf7f1;
      --rose: #b98283;
      --brown: #66534d;
      --muted: #8b7770;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: var(--ivory);
      color: var(--brown);
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    main {
      width: min(100%, 520px);
      padding: 42px 24px;
      border: 1px solid #eadbd5;
      background: rgba(255,255,255,.58);
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(93,69,61,.07);
    }
    .eyebrow {
      margin: 0 0 14px;
      color: var(--rose);
      font: 11px/1.5 Arial, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 43px);
      font-weight: 400;
      line-height: 1.15;
    }
    .details {
      margin: 20px 0 28px;
      color: var(--muted);
      font: 14px/1.8 Arial, sans-serif;
    }
    .hint {
      margin: 22px 0 0;
      color: var(--muted);
      font: 12px/1.6 Arial, sans-serif;
    }
    add-to-calendar-button { --atcb-background: #b98283; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little celebration</p>
    <h1>A Little Baby Is<br>Blooming Soon!</h1>
    <p class="details">
      Saturday, May 15, 2027<br>
      2:00 PM – 5:00 PM<br>
      The Velvet Garden, Fairbloom
    </p>

    <add-to-calendar-button
      name="A Little Baby Is Blooming Soon!"
      start-date="2027-05-15"
      start-time="14:00"
      end-date="2027-05-15"
      end-time="17:00"
      time-zone="Europe/Athens"
      location="The Velvet Garden, Fairbloom"
      options="['apple','google','ical']"
      language="en"
      list-style="dropdown"
      button-style="round"
      size="3"
      light-mode="bodyScheme"
      hide-checkmark
      hide-branding="false"
      i-cal-file-name="baby-in-bloom-invitation"
    ></add-to-calendar-button>

    <p class="hint">Choose your calendar to save the event.</p>
  </main>
</body>
</html>
