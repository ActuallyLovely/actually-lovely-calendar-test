<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add to Calendar | Actually Lovely</title>
<script src="https://cdn.jsdelivr.net/npm/add-to-calendar-button@3.6.0" async defer></script>
<style>
:root{--ivory:#fbf7f1;--rose:#b98283;--brown:#66534d;--muted:#8b7770;--line:#eadbd5}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:26px 16px;background:var(--ivory);color:var(--brown);font-family:Georgia,serif;text-align:center}
main{width:min(100%,540px);padding:42px 25px;border:1px solid var(--line);background:#ffffffb0;border-radius:18px;box-shadow:0 12px 36px #5d453d12}
.eyebrow{margin:0 0 14px;color:var(--rose);font:11px Arial;letter-spacing:.22em;text-transform:uppercase}h1{margin:0;font-size:clamp(29px,7vw,43px);font-weight:400;line-height:1.16}
.details{margin:20px 0 27px;color:var(--muted);font:14px/1.85 Arial;white-space:pre-line}.hint{margin:22px 0 0;color:var(--muted);font:12px/1.6 Arial}.edit{display:inline-block;margin-top:22px;color:var(--rose);font:12px Arial}
add-to-calendar-button{--atcb-background:#b98283;--atcb-text:#fff}</style></head><body><main>
<p class="eyebrow">A little celebration</p><h1 id="event-title">A Little Baby Is Blooming Soon!</h1><p class="details" id="event-details">Loading event details…</p><div id="calendar-button"></div>
<p class="hint">Choose your preferred calendar to save the event.</p><a class="edit" href="./create.html">Create or update your event details</a></main>
<script>
(function(){const q=new URLSearchParams(location.search);const e={title:q.get("title")||"A Little Baby Is Blooming Soon!",date:q.get("date")||"2027-05-15",start:q.get("start")||"14:00",end:q.get("end")||"17:00",location:q.get("location")||"The Velvet Garden, Fairbloom",description:q.get("description")||"Join us for a sweet baby shower celebration!",timezone:q.get("timezone")||"Europe/Athens"};
document.getElementById("event-title").textContent=e.title;const d=new Date(e.date+"T12:00:00");const pretty=isNaN(d)?e.date:new Intl.DateTimeFormat("en",{weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(d);
document.getElementById("event-details").textContent=[pretty,e.start+" – "+e.end,e.location].filter(Boolean).join("\n");
const b=document.createElement("add-to-calendar-button");[["name",e.title],["start-date",e.date],["start-time",e.start],["end-date",e.date],["end-time",e.end],["time-zone",e.timezone],["location",e.location],["description",e.description],["options","['apple','google','ical']"],["language","en"],["list-style","dropdown"],["button-style","round"],["size","3"],["light-mode","bodyScheme"],["hide-checkmark",""],["i-cal-file-name","actually-lovely-event"]].forEach(([k,v])=>b.setAttribute(k,v));document.getElementById("calendar-button").appendChild(b);})();
</script></body></html>
